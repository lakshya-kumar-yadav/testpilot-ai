services:
  postgres:
    image: postgres:16-alpine
    container_name: testpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testpilot
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - testpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot -d testpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  testpilot_postgres_data:
